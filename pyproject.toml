[project]
name = "multiplex"
version = "0.1.0"
description = "Local LLM inference on mlx-lm: batched MTP speculative decoding with a dynamic-batch scheduler (concurrent requests join/leave mid-flight)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
urls = { Repository = "https://github.com/wang1ang/multiplex" }
dependencies = [
    "huggingface-hub>=0.24",
    "mlx>=0.32",
    "mlx-lm>=0.31",
    "numpy>=1.26",
    # Backend by platform. On macOS the `mlx` wheel pulls `mlx-metal` itself, so
    # nothing is needed here. On Linux it pulls no GPU backend at all — the CUDA
    # one is an extra. `mlx[cuda13]`'s own markers are already Linux-only, so the
    # marker below is redundant for correctness and kept for legibility.
    # mlx-cuda 0.32.4 pulls the CUDA headers and finds them in site-packages;
    # 0.32.0 fails the first JIT compile unless CUDA_HOME is set. macOS keeps
    # the plain >=0.32 floor so a local 0.32.0 fork build is not replaced.
    "mlx[cuda13]>=0.32.4; platform_system == 'Linux'",
]

[project.scripts]
multiplex = "multiplex.server:main"

[project.optional-dependencies]
cli = ["prompt_toolkit>=3.0"]   # try_engine.py Chat CLI only
# For a CUDA 12 driver instead of 13. The cuda13 pin above still installs, so
# swap it out afterwards as the README "Linux / CUDA" shows. mlx-cuda-12 does
# not pull the CUDA headers, so add them here.
cuda12 = [
    "mlx[cuda12]>=0.32.4; platform_system == 'Linux'",
    "nvidia-cuda-runtime-cu12; platform_system == 'Linux'",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["multiplex*"]
